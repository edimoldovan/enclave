[package]
name = "post-ui"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
authors = ["Eduard Moldovan"]
description = "Enclave Post's window: accounts, inbox and message detail, over the headless mail library"

[features]
default = ["webview"]
# The HTML body pane. Needs webkit2gtk-4.1 and gtk3 at build time on Linux.
# Without them, build with --no-default-features: the detail view falls back to
# the plain-text body, and everything else is unchanged.
webview = ["dep:wry", "dep:gtk"]

[dependencies]
eframe = "0.33.3"
enclave-ui = { path = "../enclave-ui" }
post = { path = "../post" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
wry = { version = "0.57.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
